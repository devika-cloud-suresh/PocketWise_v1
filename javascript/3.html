<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Data Types</h2>

<p id="output"></p>

<script>
let name = "Rahul";
let age = 20;
let percentage = 85.5;
let passed = true;
let result;
let address = null;

let output = "";

output += "Name: " + typeof name + "<br>";
output += "Age: " + typeof age + "<br>";
output += "Percentage: " + typeof percentage + "<br>";
output += "Passed: " + typeof passed + "<br>";
output += "Result: " + typeof result + "<br>";
output += "Address: " + typeof address;

document.getElementById("output").innerHTML = output;
</script>

</body>
</html>
