<!DOCTYPE html>
<html>
<head>
    <title>Variables in JavaScript</title>
</head>
<body>

    <h2>Student Information</h2>

    <p id="output"></p>

    <script>
        let studentName = "Rahul";
        let age = 20;
        let marks = 85;

        const university = "LPU";

        document.getElementById("output").textContent =
            "Name: " + studentName +
            ", Age: " + age +
            ", Marks: " + marks +
            ", University: " + university;
    </script>

</body>
</html>
